name: Standalone releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Birdtracks-linux-x86_64
            executable: dist/Birdtracks
          - os: windows-latest
            artifact: Birdtracks-windows-x86_64
            executable: dist/Birdtracks.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --upgrade pip ".[standalone]"
      - name: Build self-contained application
        run: python -m PyInstaller --clean --noconfirm packaging/birdtracks.spec
      - name: Smoke-test bundled runtime
        shell: python
        run: |
          import subprocess
          subprocess.run(
              [r"${{ matrix.executable }}", "--self-test"],
              check=True,
              timeout=120,
          )
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error

      - name: Attach application to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.executable }}
